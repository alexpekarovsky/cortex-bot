[tool.poetry]
name = "cortex-mcp"
version = "1.0.0"
description = "MCP server providing AI assistants with Cortex XSIAM security operations capabilities"
authors = ["Palo Alto Networks <devrel@paloaltonetworks.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/PaloAltoNetworks/cortex-mcp"
repository = "https://github.com/PaloAltoNetworks/cortex-mcp"
documentation = "https://github.com/PaloAltoNetworks/cortex-mcp/blob/master/docs/CORTEX_XSIAM_MCP_INSTALLATION_GUIDE.md"
keywords = ["mcp", "cortex", "xsiam", "security", "soc", "xdr", "ai", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "0.116.1"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
types-requests = "^2.32.0.20250515"
requests = "^2.32.3"
fastmcp = "^2.12.0"
mcp = "^1.9.3"
starlette = "0.47.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.10"
black = "^25.1.0"
mypy = "^1.15.0"
pytest = "^8.3.5"
pre-commit = "^4.2.0"
pytest-asyncio = "^1.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
fix = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501" # line too long
]