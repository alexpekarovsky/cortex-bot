[tool.poetry]
name = "CortexMCP"
version = "1.0.0"
description = ""
authors = []
readme = "README.md"
packages = [
    { include = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.115.0"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
google-adk = "^1.0.0"
google-genai = "^1.15.0"
elasticsearch = "8.8.1"
redis = "5.3.0"
types-requests = "^2.32.0.20250515"
requests = "^2.32.3"
fastmcp = "^2.10.0"
mcp = "^1.9.3"
python-json-logger = "^3.3.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.10"
black = "^25.1.0"
mypy = "^1.15.0"
pytest = "^8.3.5"
pre-commit = "^4.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
fix = true
