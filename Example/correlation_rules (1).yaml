- action: ALERTS
  alert_category: DISCOVERY
  alert_description: the host $action_local_ip launched more than 10 distinct IP addressed
    over more than 4 ports in a 30 minute time frame
  alert_domain: DOMAIN_SECURITY
  alert_fields:
    action_local_ip: action_local_ip
    agent_hostname: action_local_ip
  alert_name: '[Network] Network Scanning - Host scanned multiple IPs on multiple
    service ports'
  alert_type: null
  crontab: '*/10 * * * *'
  dataset: alerts
  description: this rule will check if host performed more than 7 network connection
    on more than 4 well known ports in the last 30 minutes
  drilldown_query_timeframe: ALERT
  execution_mode: SCHEDULED
  global_rule_id: 08f22cf1-1c13-4a17-bed8-a41ec9c30073
  investigation_query_link: "preset = network_story | filter action_local_ip = $action_local_ip\
    \ | \n// Filter for the well known ports - services, os\nfilter (action_remote_port\
    \ > 1 and action_remote_port < 1025) or action_remote_port in (3389,1433,1521)|\
    \ \ncomp values(action_remote_port) as ScannedPorts |\narrayexpand ScannedPorts"
  lookup_mapping: null
  mapping_strategy: CUSTOM
  mitre_defs:
    TA0007 - Discovery:
    - T1046 - Network Service Scanning
  name: '[Network] Network Scanning - Host scanned multiple IPs on multiple service
    ports'
  search_window: 1 hours
  severity: SEV_030_MEDIUM
  suppression_duration: 1 hours
  suppression_enabled: true
  suppression_fields: action_local_ip
  user_defined_category: null
  user_defined_severity: null
  xql_query: "preset = network_story | \n\n// Filter based on monitored networks\n\
    filter action_local_ip incidr \"172.21.1.1/16\" and action_remote_ip incidr  \"\
    172.21.1.1/16\" |\n\n// Filter for the well known ports - services, os\nfilter\
    \ (action_remote_port > 1 and action_remote_port < 1025) or action_remote_port\
    \ in (3389,1433,1521) |\n\n// Group the amount of distinct ports by the source\
    \ address and the destination address\ncomp count_distinct(action_remote_port)\
    \ as numofports by action_local_ip , action_remote_ip | \n\n// Filter to show\
    \ addresses that scanned more than 4 ports\nfilter numofports >= 4 | \n\n// Group\
    \ the amount of distinct destination IPs by the source IP and add the raw data\n\
    comp count_distinct(action_remote_ip) as numofips by action_local_ip addrawdata\
    \ = true |\n\n// Filter to source IPs which accessed more than 10 destinations\n\
    filter numofips >= 7"
