    \ contains \"security\" and agent_hostname contains \"dc\" and (action_evtlog_event_id\
    \ = 4769 or action_evtlog_event_id = 4768 or action_evtlog_event_id = 4771)| \n\
    \n// fields extraction\nalter subj_user = action_evtlog_data_fields -> SubjectUserName,\
    \ target_username = action_evtlog_data_fields -> TargetUserName , kerbe_service_name\
    \ = action_evtlog_data_fields -> ServiceName |\nalter remote_ip_actor = action_evtlog_data_fields\
    \ -> IpAddress| \nalter remote_actor_parsed = if(remote_ip_actor contains \"ff\"\
