- action: ALERTS
  alert_category: User Defined
  alert_description: Portable AnyDesk execution detection
  alert_domain: DOMAIN_SECURITY
  alert_fields: {}
  alert_name: Portable AnyDesk Detected
  alert_type: null
  crontab: null
  dataset: alerts
  description: This rule looks for portable  anydesk executions in the organization
  drilldown_query_timeframe: ALERT
  execution_mode: REAL_TIME
  global_rule_id: be50c38f-67f4-4559-98fc-c9e195eb94dc
  investigation_query_link: 'dataset = xdr_data | filter action_process_image_sha256  =
    $action_process_image_sha256 | fields event_type, event_sub_type , agent_hostname,
    actor_effective_username, action_process_image_name , actor_process_image_name  |
    alter image_name = if(action_process_image_name,null,actor_process_image_name)
    | fields -action_process_image_name, actor_process_image_name '
  lookup_mapping: null
  mapping_strategy: AUTO
  mitre_defs: {}
  name: Portable AnyDesk Detected
  search_window: null
  severity: SEV_030_MEDIUM
  suppression_duration: 30 minutes
  suppression_enabled: true
  suppression_fields: agent_id|action_process_image_sha256
  user_defined_category: category
  user_defined_severity: null
  xql_query: "config case_sensitive = false | dataset = xdr_data | \nfilter event_type\
    \ = ENUM.PROCESS and event_sub_type = ENUM.PROCESS_START  and action_process_signature_vendor\
    \ contains \"anydesk\" | \n alter category = \"Threat Detection\" | fields action_process_signature_*,\
    \ action_process_image_path, action_process_image_sha256, actor_effective_username,\
    \ agent_hostname, category , causality_actor_causality_id , action_process_image_name\
    \ , agent_id"
