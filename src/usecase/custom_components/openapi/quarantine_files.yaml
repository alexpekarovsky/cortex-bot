openapi: 3.0.0
paths:
  /public_api/v1/endpoints/quarantine/:
    post:
      summary: Quarantine Malicious Files
      description: |-
        DESTRUCTIVE ACTION - Risk Level: HIGH
        Reversal: Use restore_file to restore quarantined files.

        Quarantines one or more suspicious or malicious files on an endpoint.
        Quarantined files are moved to a secure location and prevented from executing,
        but are not deleted. This allows for later forensic analysis or restoration
        if the file is determined to be benign.

        WARNING: Quarantined files may break applications that depend on them.
        Ensure you understand what the file is used for before quarantining.

        Use this when:
        - You've identified malicious files that need to be neutralized
        - You want to prevent file execution without permanently deleting evidence
        - You need to contain a threat while preserving files for analysis
        - Multiple suspicious files need to be quarantined simultaneously

        Files can be restored later using the restore_file tool if needed.
      operationId: quarantine_files
      tags:
        - Endpoint Response
      requestBody:
        description: JSON object containing endpoint ID and file paths to quarantine
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuarantineFilesRequest'
            examples:
              quarantine_file:
                summary: Quarantine a file by path and hash
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["a1b2c3d4e5f6g7h8"]
                    file_path: "C:\\Users\\admin\\malware.exe"
                    file_hash: "abc123def456789"
      responses:
        '200':
          description: Successful response - quarantine action initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: object
                    properties:
                      action_id:
                        type: integer
                        description: Unique ID for tracking this quarantine action
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid API credentials
        '403':
          description: Forbidden - insufficient permissions

components:
  schemas:
    QuarantineFilesRequest:
      type: object
      properties:
        request_data:
          type: object
          required:
            - filters
            - file_path
            - file_hash
          properties:
            filters:
              type: array
              description: Filter criteria for selecting endpoints
              items:
                type: object
                properties:
                  field:
                    type: string
                    enum: [endpoint_id_list]
                  operator:
                    type: string
                    enum: [in]
                  value:
                    type: array
                    items:
                      type: string
                required: [field, operator, value]
            file_path:
              type: string
              description: File path to quarantine
            file_hash:
              type: string
              description: File hash to quarantine (required by API)
