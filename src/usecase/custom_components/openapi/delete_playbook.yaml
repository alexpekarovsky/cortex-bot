openapi: 3.0.0
paths:
  /public_api/v1/playbooks/delete:
    post:
      summary: Delete Playbook
      description: |-
        Delete a playbook by filtering based on its name or ID.

        Use this to:
        - Remove obsolete playbooks
        - Clean up test playbooks
        - Manage playbook inventory

        You must have Instance Administrator permissions to run this endpoint.

        **WARNING:** This is a destructive operation. Deleted playbooks cannot be recovered
        unless you have a backup. Consider using get_playbook to download a backup first.

        **Best Practice:**
        1. Download playbook with get_playbook (backup)
        2. Confirm deletion is intended
        3. Delete with this tool
      operationId: delete_playbook
      tags:
        - Playbooks
      requestBody:
        description: Filter to identify the playbook to delete
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeletePlaybookRequest'
            examples:
              delete_by_name:
                summary: Delete playbook by name
                value:
                  request_data:
                    filter:
                      field: "name"
                      value: "Old Test Playbook"
              delete_by_id:
                summary: Delete playbook by ID
                value:
                  request_data:
                    filter:
                      field: "id"
                      value: "playbook-12345"
      responses:
        '200':
          description: Playbook deleted successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden - requires Instance Administrator
        '404':
          description: Playbook not found
        '500':
          description: Internal server error

components:
  schemas:
    DeletePlaybookRequest:
      type: object
      required:
        - request_data
      properties:
        request_data:
          type: object
          required:
            - filter
          properties:
            filter:
              type: object
              required:
                - field
                - value
              properties:
                field:
                  type: string
                  enum: ["name", "id"]
                  description: Filter field (name or id)
                value:
                  type: string
                  description: Playbook name or ID to delete
