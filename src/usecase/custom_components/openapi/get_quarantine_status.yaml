openapi: 3.0.0
paths:
  /public_api/v1/quarantine/status:
    post:
      summary: Get Quarantine Status
      description: |-
        Retrieve the quarantine status for specified files.

        Use this to:
        - Check if files are currently quarantined before attempting restore
        - Verify quarantine operations completed successfully
        - List quarantined files on specific endpoints
        - Audit quarantine status across the environment
      operationId: get_quarantine_status
      tags:
        - Quarantine Management
      requestBody:
        description: JSON object containing files to check quarantine status
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetQuarantineStatusRequest'
            examples:
              check_file_status:
                summary: Check if file is quarantined
                value:
                  request_data:
                    files:
                      - endpoint_id: "a1b2c3d4e5f6g7h8"
                        file_path: "C:\\temp\\suspicious.exe"
                        file_hash: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
      responses:
        '200':
          description: Successful response with quarantine status
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid API credentials
        '402':
          description: Payment required
        '403':
          description: Forbidden - insufficient permissions
        '500':
          description: Internal server error

components:
  schemas:
    GetQuarantineStatusRequest:
      type: object
      required:
        - request_data
      properties:
        request_data:
          type: object
          required:
            - files
          properties:
            files:
              type: array
              description: Array of files to check quarantine status
              items:
                type: object
                properties:
                  endpoint_id:
                    type: string
                    description: Endpoint ID where the file is located
                  file_path:
                    type: string
                    description: Full path to the file
                  file_hash:
                    type: string
                    description: SHA256 hash of the file
                required:
                  - endpoint_id
                  - file_path
                  - file_hash
