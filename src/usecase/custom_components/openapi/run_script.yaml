openapi: 3.0.0
paths:
  /public_api/v1/scripts/run_script/:
    post:
      summary: Execute Pre-Registered Scripts on Endpoints
      description: |-
        Executes PRE-REGISTERED scripts from your XSIAM script library on target endpoints.
        Use this for running tested, approved scripts. For ad-hoc code, use run_snippet_code_script.

        WORKFLOW:
        1. get_scripts → Find available scripts and their script_uid
        2. get_script_metadata → Get required parameters for the script
        3. run_script → Execute with script_uid and parameters_values
        4. get_script_execution_status → Monitor execution progress
        5. get_script_execution_results → Retrieve output when complete

        Use this tool when:
        - Running pre-built, tested scripts from the XSIAM library
        - Executing standard forensic or remediation scripts
        - You know the script_uid (use get_scripts to find it)

        Use run_snippet_code_script instead when:
        - Running ad-hoc, one-off code snippets
        - Quick diagnostic commands
        - Proof-of-concept testing

        Supported script types:
        - PowerShell (Windows endpoints)
        - Bash/Shell (Linux/Unix endpoints)

        Common use cases:
        - Collecting memory dumps
        - Gathering network configuration
        - Checking for persistence mechanisms
        - Custom malware removal procedures
        - Collecting registry keys (Windows)
        - File system searches
        - Process analysis
        - User account enumeration

        CAUTION: Scripts execute with agent privileges. Ensure scripts are:
        - Thoroughly tested
        - Non-destructive unless intended
        - Appropriate for the target OS
        - Compliant with organizational policies
      operationId: run_script
      tags:
        - Endpoint Response
      requestBody:
        description: JSON object containing endpoint ID and script to execute
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunScriptRequest'
            examples:
              run_registered_script:
                summary: Run a pre-registered script by UID
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["a1b2c3d4e5f6g7h8"]
                    script_uid: "script-12345-abc-def"
      responses:
        '200':
          description: Successful response - script execution initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: object
                    properties:
                      action_id:
                        type: integer
                        description: Unique ID for tracking this script execution action
        '400':
          description: Bad request - invalid parameters or script
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request"
        '401':
          description: Unauthorized - invalid API credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"

components:
  schemas:
    RunScriptRequest:
      type: object
      properties:
        request_data:
          type: object
          required:
            - filters
            - script_uid
            - parameters_values
          properties:
            filters:
              type: array
              description: Filter criteria for selecting endpoints
              items:
                type: object
                properties:
                  field:
                    type: string
                    enum: [endpoint_id_list]
                    description: Field to filter on
                  operator:
                    type: string
                    enum: [in]
                    description: Filter operator
                  value:
                    type: array
                    description: List of endpoint IDs
                    items:
                      type: string
                required: [field, operator, value]
            script_uid:
              type: string
              description: Unique identifier for a pre-registered script in XSIAM
            parameters_values:
              type: object
              description: Dictionary containing parameter names and values for script execution (required - use {} if script has no parameters)
            timeout:
              type: integer
              description: Script execution timeout in seconds (default 600)
              default: 600
            incident_id:
              type: string
              description: Incident ID to associate this action with
