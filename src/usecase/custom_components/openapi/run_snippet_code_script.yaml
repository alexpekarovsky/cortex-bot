openapi: 3.0.0
paths:
  /public_api/v1/scripts/run_snippet_code_script:
    post:
      summary: Run Ad-Hoc Code Snippets on Endpoints
      description: |-
        Executes AD-HOC code snippets on endpoints without pre-registering them.
        For running pre-registered, tested scripts, use run_script instead.

        Use this tool when:
        - Running quick, one-off diagnostic commands
        - Ad-hoc investigations that don't need a registered script
        - Proof-of-concept testing before creating a registered script
        - Simple commands that don't warrant full script registration

        Use run_script instead when:
        - Running pre-built, tested scripts from the library
        - Executing standard forensic or remediation procedures
        - You have a script_uid for a registered script

        WORKFLOW:
        1. run_snippet_code_script → Execute ad-hoc code
        2. get_script_execution_status → Monitor execution progress
        3. get_script_execution_results → Retrieve output when complete

        CAUTION: This is a powerful tool - only run trusted, tested code.
        Scripts execute with agent privileges.
      operationId: run_snippet_code_script
      tags:
        - Script Execution
      requestBody:
        description: JSON object with snippet code to execute
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunSnippetCodeScriptRequest'
            examples:
              windows_example:
                summary: Run PowerShell snippet
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["endpoint-id-here"]
                    snippet_code: "Write-Host 'Test'"
                    timeout: 300
      responses:
        '200':
          description: Successful response - snippet execution initiated
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '402':
          description: Payment required
        '403':
          description: Forbidden
        '500':
          description: Internal server error

components:
  schemas:
    RunSnippetCodeScriptRequest:
      type: object
      properties:
        request_data:
          type: object
          required:
            - filters
            - snippet_code
          properties:
            filters:
              type: array
              description: Filter criteria for selecting endpoints
              items:
                type: object
                properties:
                  field:
                    type: string
                    enum: [endpoint_id_list]
                  operator:
                    type: string
                    enum: [in]
                  value:
                    type: array
                    items:
                      type: string
                required: [field, operator, value]
            snippet_code:
              type: string
              description: Code snippet to execute on endpoints
            timeout:
              type: integer
              description: Timeout in seconds (default 600)
              default: 600
            incident_id:
              type: string
              description: Incident ID to associate with this action
