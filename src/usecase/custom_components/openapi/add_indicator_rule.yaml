openapi: 3.0.0
paths:
  /public_api/v1/indicators/add_rule/:
    post:
      summary: Add Indicator of Compromise (IOC) Rule
      description: |-
        Adds Indicators of Compromise (IOCs) to XSIAM for automatic detection and prevention.
        When IOCs are added, XSIAM will automatically alert or block matching activity across
        your environment. This is essential for operationalizing threat intelligence.

        Supported IOC types:
        - IP addresses (IPv4 and IPv6)
        - Domain names
        - File hashes (MD5, SHA1, SHA256)
        - URLs
        - File names/paths

        Actions available:
        - ALERT: Generate an alert when IOC is detected
        - BLOCK: Block the IOC and generate an alert
        - ALLOW: Whitelist (use for known good indicators)

        Use this when:
        - You discover new malicious indicators during investigation
        - Implementing threat intelligence from external sources
        - Adding IOCs from malware analysis
        - Creating custom detection rules
        - Operationalizing incident findings

        Example use cases:
        - Block C2 IP addresses discovered during incident response
        - Alert on malicious file hashes from threat intelligence feeds
        - Block malicious domains used in phishing campaigns
        - Create detection rules for specific malware families
        - Whitelist false positive indicators

        IOCs can include expiration dates and severity levels. You can also add
        comments for context and attribution.
      operationId: add_indicator_rule
      tags:
        - Indicators
      requestBody:
        description: JSON object containing IOC details
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddIndicatorRequest'
            examples:
              block_malicious_ip:
                summary: Block malicious IP address
                value:
                  request_data:
                    indicator_type: "IP"
                    indicator_value: "192.168.100.50"
                    action: "BLOCK"
                    severity: "HIGH"
                    comment: "C2 server identified in incident #12345"
              alert_on_malware_hash:
                summary: Alert on malware file hash
                value:
                  request_data:
                    indicator_type: "HASH"
                    indicator_value: "abc123def456789abc123def456789abc123def456789abc123def456789"
                    hash_type: "SHA256"
                    action: "ALERT"
                    severity: "CRITICAL"
                    comment: "Ransomware hash from malware analysis"
              block_phishing_domain:
                summary: Block phishing domain
                value:
                  request_data:
                    indicator_type: "DOMAIN"
                    indicator_value: "malicious-phishing-site.com"
                    action: "BLOCK"
                    severity: "HIGH"
                    comment: "Phishing domain from security alert"
                    expiration_date: "2025-12-31"
              whitelist_legitimate_ip:
                summary: Whitelist known good IP
                value:
                  request_data:
                    indicator_type: "IP"
                    indicator_value: "203.0.113.100"
                    action: "ALLOW"
                    comment: "Legitimate business partner IP - false positive"
      responses:
        '200':
          description: Successful response - IOC rule added
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: object
                    properties:
                      rule_id:
                        type: string
                        description: Unique identifier for the created rule
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request"
        '401':
          description: Unauthorized - invalid API credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"

components:
  schemas:
    AddIndicatorRequest:
      type: object
      properties:
        request_data:
          type: object
          required:
            - indicator_type
            - indicator_value
            - action
          properties:
            indicator_type:
              type: string
              description: Type of indicator
              enum:
                - IP
                - DOMAIN
                - HASH
                - URL
                - FILE_NAME
            indicator_value:
              type: string
              description: The actual indicator value (IP, domain, hash, URL, or file name)
            hash_type:
              type: string
              description: Hash algorithm (required if indicator_type is HASH)
              enum:
                - MD5
                - SHA1
                - SHA256
            action:
              type: string
              description: Action to take when indicator is detected
              enum:
                - ALERT
                - BLOCK
                - ALLOW
            severity:
              type: string
              description: Severity level for alerts (optional)
              enum:
                - LOW
                - MEDIUM
                - HIGH
                - CRITICAL
            comment:
              type: string
              description: Comment or context for this indicator (optional but recommended)
            expiration_date:
              type: string
              description: Expiration date in YYYY-MM-DD format (optional)
              pattern: '^\d{4}-\d{2}-\d{2}$'
