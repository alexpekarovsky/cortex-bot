openapi: 3.0.0
paths:
  /public_api/v1/endpoints/get_endpoints/:
    post:
      summary: Get Endpoint Information
      description: |-
        Retrieves detailed information about endpoints (computers, servers, devices) in your environment.
        This provides comprehensive data about machines including their operating system, IP addresses,
        agent status, last seen time, and more.

        Use this to:
        - Identify endpoints involved in incidents
        - Check endpoint agent status and connectivity
        - Get endpoint details before performing response actions
        - Inventory and asset management
        - Verify endpoint configuration

        Information returned includes:
        - Endpoint ID and hostname
        - Operating system type and version
        - IP addresses (IPv4 and IPv6)
        - MAC addresses
        - Agent version and installation status
        - Last seen / last active timestamp
        - Domain information
        - Isolation status
        - Endpoint group membership

        You can filter endpoints by various criteria or retrieve all endpoints.
      operationId: get_endpoints
      tags:
        - Endpoints
      requestBody:
        description: JSON object containing filters for endpoint search. Empty request returns all endpoints.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetEndpointsRequest'
            examples:
              all_endpoints:
                summary: Get all endpoints
                value:
                  request_data: {}
              by_hostname:
                summary: Filter by hostname
                value:
                  request_data:
                    filters:
                      - field: "hostname"
                        operator: "in"
                        value:
                          - "DESKTOP-ABC123"
                          - "SERVER-XYZ789"
              by_ip:
                summary: Filter by IP address
                value:
                  request_data:
                    filters:
                      - field: "ip_address"
                        operator: "in"
                        value:
                          - "192.168.1.100"
              isolated_endpoints:
                summary: Get isolated endpoints
                value:
                  request_data:
                    filters:
                      - field: "endpoint_status"
                        operator: "in"
                        value:
                          - "isolated"
              with_pagination:
                summary: Get endpoints with pagination
                value:
                  request_data:
                    search_from: 0
                    search_to: 100
      responses:
        '200':
          description: Successful response containing endpoint information
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: array
                    items:
                      type: object
                      description: Endpoint details
                      properties:
                        endpoint_id:
                          type: string
                        agent_id:
                          type: string
                        host_name:
                          type: string
                        agent_type:
                          type: string
                        agent_status:
                          type: string
                        operational_status:
                          type: string
                        ip:
                          type: array
                          items:
                            type: string
                        users:
                          type: array
                          items:
                            type: string
                        last_seen:
                          type: integer
                        tags:
                          type: object
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request"
        '401':
          description: Unauthorized - invalid API credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"

components:
  schemas:
    GetEndpointsRequest:
      type: object
      properties:
        request_data:
          type: object
          properties:
            filters:
              type: array
              description: Array of filter criteria
              items:
                $ref: '#/components/schemas/Filter'
            search_from:
              type: integer
              description: Starting index for pagination (default 0)
              default: 0
            search_to:
              type: integer
              description: Ending index for pagination (default 100)
              default: 100

    Filter:
      type: object
      properties:
        field:
          type: string
          description: Field to filter on
          enum:
            - endpoint_id
            - hostname
            - ip_address
            - endpoint_status
            - os_type
            - domain
        operator:
          type: string
          description: Comparison operator
          enum:
            - in
            - contains
        value:
          description: Value(s) to filter by - can be string or array
          oneOf:
            - type: string
            - type: array
              items:
                type: string
