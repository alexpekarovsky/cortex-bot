openapi: 3.0.0
paths:
  /public_api/v1/endpoints/terminate/:
    post:
      summary: Terminate a Malicious Process
      description: |-
        Terminates a specific process running on an endpoint.
        Use this to stop individual malicious processes identified during investigation.

        This terminates only the specified process. For more comprehensive remediation
        that also terminates all parent and child processes (the entire causality chain),
        use the terminate_causality endpoint instead.

        Use this when:
        - A specific malicious process needs to be stopped
        - You want to terminate a single process without affecting related processes
        - You've identified a suspicious process that needs immediate termination
      operationId: terminate_process
      tags:
        - Endpoint Response
      requestBody:
        description: JSON object containing the endpoint and process identifiers
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminateProcessRequest'
            examples:
              terminate_by_pid:
                summary: Terminate process by PID
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["a1b2c3d4e5f6g7h8"]
                    process_id: 1234
      responses:
        '200':
          description: Successful response - termination action initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: object
                    properties:
                      action_id:
                        type: integer
                        description: Unique ID for tracking this termination action
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid API credentials
        '403':
          description: Forbidden - insufficient permissions

components:
  schemas:
    TerminateProcessRequest:
      type: object
      properties:
        request_data:
          type: object
          required:
            - filters
            - process_id
          properties:
            filters:
              type: array
              description: Filter criteria for selecting endpoints
              items:
                type: object
                properties:
                  field:
                    type: string
                    enum: [endpoint_id_list]
                    description: Field to filter on
                  operator:
                    type: string
                    enum: [in]
                    description: Filter operator
                  value:
                    type: array
                    description: List of endpoint IDs
                    items:
                      type: string
                required: [field, operator, value]
            process_id:
              type: integer
              description: The process ID (PID) to terminate
