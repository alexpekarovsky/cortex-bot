openapi: 3.0.0
paths:
  /public_api/v1/endpoints/abort_scan:
    post:
      summary: Cancel Scan Endpoints
      description: |-
        Cancel the scan of selected endpoints. A scan can only be aborted if the
        selected endpoints are in Pending or In Progress status.

        Use this to:
        - Stop resource-intensive full scans
        - Cancel accidental scans on wrong endpoints
        - Free up endpoint resources during business hours
        - Cancel scans that are taking too long

        This is the reversal operation for scan_endpoint.
      operationId: abort_scan
      tags:
        - Endpoint Response
      requestBody:
        description: JSON object containing endpoints to abort scan
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbortScanRequest'
            examples:
              abort_all:
                summary: Cancel all pending/running scans
                value:
                  request_data:
                    filters: "all"
              abort_specific:
                summary: Cancel scan on specific endpoints
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["a1b2c3d4e5f6g7h8"]
      responses:
        '200':
          description: Successful response - scan cancellation initiated
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid API credentials
        '402':
          description: Payment required
        '403':
          description: Forbidden - insufficient permissions
        '500':
          description: Internal server error

components:
  schemas:
    AbortScanRequest:
      type: object
      properties:
        request_data:
          type: object
          properties:
            filters:
              description: Filter criteria or "all" to cancel all scans
              oneOf:
                - type: string
                  enum: ["all"]
                - type: array
                  items:
                    type: object
                    properties:
                      field:
                        type: string
                        enum: [endpoint_id_list]
                      operator:
                        type: string
                        enum: [in]
                      value:
                        type: array
                        items:
                          type: string
                    required: [field, operator, value]
            incident_id:
              type: string
              description: Incident ID to associate abort action with
