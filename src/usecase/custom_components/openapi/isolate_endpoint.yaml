openapi: 3.0.0
paths:
  /public_api/v1/endpoints/isolate/:
    post:
      summary: Isolate Endpoint from Network
      description: |-
        Isolates an endpoint from the network to contain threats and prevent lateral movement.
        When an endpoint is isolated, it can only communicate with the Cortex agent and cannot
        access other network resources. This is critical for incident response to contain
        compromised systems.

        Use this when:
        - A system is confirmed compromised and needs immediate containment
        - You need to prevent malware from spreading to other systems
        - An endpoint is exhibiting malicious behavior
        - As part of incident response to isolate affected systems

        The endpoint can be un-isolated later once the threat is remediated.
      operationId: isolate_endpoint
      tags:
        - Endpoint Response
      requestBody:
        description: JSON object containing the endpoint identifier to isolate
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IsolateEndpointRequest'
            examples:
              by_endpoint_id:
                summary: Isolate endpoint by endpoint ID
                value:
                  request_data:
                    endpoint_id: "a1b2c3d4e5f6g7h8"
              by_filters:
                summary: Isolate multiple endpoints using filters
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["a1b2c3d4e5f6g7h8", "b2c3d4e5f6g7h8i9"]
      responses:
        '200':
          description: Successful response - isolation action initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: object
                    properties:
                      action_id:
                        type: integer
                        description: Unique ID for tracking this isolation action
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request"
        '401':
          description: Unauthorized - invalid API credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"
components:
  schemas:
    IsolateEndpointRequest:
      type: object
      properties:
        request_data:
          $ref: '#/components/schemas/EndpointIdentifier'

    EndpointIdentifier:
      type: object
      properties:
        filters:
          type: array
          description: Filter criteria for selecting endpoints
          items:
            type: object
            properties:
              field:
                type: string
                enum: [endpoint_id_list]
                description: Field to filter on
              operator:
                type: string
                enum: [in]
                description: Filter operator
              value:
                type: array
                description: List of endpoint IDs
                items:
                  type: string
            required: [field, operator, value]
        endpoint_id:
          type: string
          description: Single endpoint ID (alternative to filters)
      oneOf:
        - required: [filters]
        - required: [endpoint_id]
