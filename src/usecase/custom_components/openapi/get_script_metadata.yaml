openapi: 3.0.0
paths:
  /public_api/v1/scripts/get_script_metadata:
    post:
      summary: Get Script Metadata
      description: |-
        Get the full definition of a specific script in the scripts library.

        Returns:
        - Script parameters and their types
        - Supported operating systems
        - Risk level
        - Entry point and output format

        Use this before run_script to understand what parameters are required.
      operationId: get_script_metadata
      tags:
        - Script Management
      requestBody:
        description: JSON object containing script_uid
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetScriptMetadataRequest'
            examples:
              get_metadata:
                summary: Get script details
                value:
                  request_data:
                    script_uid: "script-uuid-here"
      responses:
        '200':
          description: Successful response with script metadata
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '402':
          description: Payment required
        '403':
          description: Forbidden
        '500':
          description: Internal server error

components:
  schemas:
    GetScriptMetadataRequest:
      type: object
      required:
        - request_data
      properties:
        request_data:
          type: object
          required:
            - script_uid
          properties:
            script_uid:
              type: string
              description: Unique identifier of the script
