openapi: 3.0.0
paths:
  /public_api/v1/endpoints/scan/:
    post:
      summary: Scan Endpoint for Threats
      description: |-
        Initiates an on-demand malware scan on target endpoints.
        The Cortex agent will perform a comprehensive security scan looking for
        malware, suspicious files, and other threats.

        Use this when:
        - You suspect an endpoint is compromised
        - Verifying successful remediation after cleaning malware
        - Performing proactive threat hunting
        - Investigating suspicious behavior on an endpoint
        - Following up on security alerts
        - Compliance or audit requirements

        The scan performs:
        - File system scanning for known malware signatures
        - Memory scanning for malicious processes
        - Registry scanning (Windows) for persistence mechanisms
        - Behavioral analysis of running processes
        - Signature-based and heuristic detection

        Scan types available:
        - QUICK_SCAN: Fast scan of critical areas (running processes, common malware locations)
        - FULL_SCAN: Comprehensive deep scan of entire system (takes longer)

        Results are reported in the action status and any threats found will
        generate alerts in XSIAM for review and remediation.

        Note: Scans can be resource-intensive and may impact endpoint performance.
        Consider scheduling during maintenance windows for production systems.
      operationId: scan_endpoint
      tags:
        - Endpoint Response
      requestBody:
        description: JSON object containing endpoint ID and scan parameters
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanEndpointRequest'
            examples:
              quick_scan_by_id:
                summary: Quick scan of endpoint by ID
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["a1b2c3d4e5f6g7h8"]
                    scan_type: "QUICK_SCAN"
              full_scan_multiple:
                summary: Full scan of multiple endpoints
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["a1b2c3d4e5f6g7h8", "b2c3d4e5f6g7h8i9"]
                    scan_type: "FULL_SCAN"
              quick_scan_default:
                summary: Quick scan (default)
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["a1b2c3d4e5f6g7h8"]
      responses:
        '200':
          description: Successful response - scan initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: object
                    properties:
                      action_id:
                        type: integer
                        description: Unique ID for tracking this scan action
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request"
        '401':
          description: Unauthorized - invalid API credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"

components:
  schemas:
    ScanEndpointRequest:
      type: object
      properties:
        request_data:
          type: object
          required:
            - filters
          properties:
            filters:
              type: array
              description: Filter criteria for selecting endpoints
              items:
                type: object
                properties:
                  field:
                    type: string
                    enum: [endpoint_id_list]
                    description: Field to filter on
                  operator:
                    type: string
                    enum: [in]
                    description: Filter operator
                  value:
                    type: array
                    description: List of endpoint IDs
                    items:
                      type: string
                required: [field, operator, value]
            scan_type:
              type: string
              description: Type of scan to perform (default QUICK_SCAN)
              enum:
                - QUICK_SCAN
                - FULL_SCAN
              default: QUICK_SCAN
