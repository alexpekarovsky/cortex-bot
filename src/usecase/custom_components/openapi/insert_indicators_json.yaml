openapi: 3.0.0
paths:
  /public_api/v1/indicators/insert_jsons:
    post:
      summary: Insert Simple Indicators (JSON)
      description: |-
        Upload IOCs as JSON objects that you retrieved from external threat intelligence sources.

        Note: Cortex XSIAM does not scan historic data, rather only new incoming data.

        Each IOC object must include:
        - indicator (required): The IOC value
        - type (required): HASH, IP, DOMAIN_NAME, FILENAME
        - severity (required): INFO, LOW, MEDIUM, HIGH, CRITICAL

        Optional fields:
        - expiration_date: Unix epoch timestamp in milliseconds
        - comment: Descriptive text
        - reputation: GOOD, BAD, SUSPICIOUS, UNKNOWN
        - reliability: A-F rating
        - vendors: Array of vendor objects
        - class: Classification (e.g., "Malware")

        Use validate=true to get detailed error messages.
      operationId: insert_indicators_json
      tags:
        - Indicator Management
      requestBody:
        description: JSON array of IOC objects
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertIndicatorsJsonRequest'
            examples:
              upload_iocs:
                summary: Upload IOCs as JSON
                value:
                  request_data:
                    - indicator: "192.0.2.1"
                      type: "IP"
                      severity: "HIGH"
                      comment: "Test IOC - RFC 5737 address"
                      reputation: "BAD"
                      reliability: "A"
                      class: "Test"
                  validate: true
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '402':
          description: Payment required
        '403':
          description: Forbidden
        '500':
          description: Internal server error

components:
  schemas:
    InsertIndicatorsJsonRequest:
      type: object
      properties:
        request_data:
          type: array
          description: Array of IOC objects
          items:
            type: object
            required:
              - indicator
              - type
              - severity
            properties:
              indicator:
                type: string
                description: The IOC value (hash, IP, domain, etc.)
              type:
                type: string
                enum: [HASH, IP, DOMAIN_NAME, FILENAME, PATH]
                description: Type of indicator
              severity:
                type: string
                enum: [INFO, LOW, MEDIUM, HIGH, CRITICAL]
                description: Severity level
              expiration_date:
                type: integer
                description: Unix epoch timestamp in milliseconds
              comment:
                type: string
                description: Descriptive comment
              reputation:
                type: string
                enum: [GOOD, BAD, SUSPICIOUS, UNKNOWN, NO_REPUTATION]
              reliability:
                type: string
                enum: [A, B, C, D, E, F, G]
                description: Reliability rating (A=most reliable)
              vendors:
                type: array
                description: List of vendor information
                items:
                  type: object
                  properties:
                    vendor_name:
                      type: string
                    reliability:
                      type: string
                      enum: [A, B, C, D, E, F, G]
                    reputation:
                      type: string
                      enum: [GOOD, BAD, SUSPICIOUS, UNKNOWN]
              class:
                type: string
                description: Classification (e.g., Malware, Phishing)
        validate:
          type: boolean
          description: Return validation errors on failure
          default: true
