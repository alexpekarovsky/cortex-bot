openapi: 3.0.0
paths:
  /public_api/v1/assets/:
    post:
      summary: Get All or Filtered Assets
      description: |-
        Retrieve a list of all your assets or a filtered list based on specified criteria.
        The maximum result limit is 5000 assets per request.
        A POST request is used to allow for a more complex filtering body.
      operationId: get_assets
      tags:
        - Assets
      requestBody:
        description: JSON object containing filters, sorting, and pagination settings. An empty request_data object returns all results up to the limit.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
            examples:
              filtered_request:
                summary: Example request with filters and sorting
                value:
                  request_data:
                    filters:
                      - field: "name"
                        operator: "in"
                        value: "AsmAssetsFilter_value"
                    sort:
                      - FIELD: "xdm.asset.name"
                        ORDER: "DESC"
                    search_from: 0
                    search_to: 100
              on_demand_fields_request:
                summary: Example with on-demand fields
                value:
                  request_data:
                    filters: []
                    on_demand_fields:
                      - "xdm.host.ipv4_addresses"
                    search_to: 50
      responses:
        '200':
          description: Successful response containing a list of assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '401':
          description: Unauthorized. The API key is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '403':
          description: Forbidden. The API key does not have the required permissions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"
components:
  schemas:
    AssetRequest:
      type: object
      properties:
        request_data:
          $ref: '#/components/schemas/AssetRequestPayload'
    AssetRequestPayload:
      type: object
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/Filter'
        on_demand_fields:
          type: array
          items:
            type: string
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortItem'
        search_from:
          type: integer
          default: 0
        search_to:
          type: integer
          default: 1000
    Filter:
      type: object
      properties:
        field:
          type: string
        operator:
          type: string
          enum:
            - in
            - gte
            - lte
            - contains
            - like
        value:
          type: string
    SortItem:
      type: object
      properties:
        FIELD:
          type: string
        ORDER:
          type: string
          enum:
            - ASC
            - DESC
    AssetResponse:
      type: object
      properties:
        reply:
          type: object
          properties:
            data:
              type: array
              description: A list of asset objects.
              items:
                $ref: '#/components/schemas/Asset'
            metadata:
              type: object
              description: Metadata about the response.
              properties:
                filter_count:
                  type: integer
                  description: The number of results matching the filter.
                total_count:
                  type: integer
                  description: The total number of assets available.
    Asset:
      type: object
      description: Represents a single asset with its properties.
      properties:
        issues_breakdown:
          type: object
          properties:
            critical:
              type: integer
            high:
              type: integer
            low:
              type: integer
            medium:
              type: integer
        'xdm.asset.first_observed':
          type: integer
          format: int64
          description: Timestamp when the asset was first observed.
        'xdm.asset.cloud.region':
          type: string
          nullable: true
          description: The cloud region of the asset.
        'xdm.asset.last_observed':
          type: integer
          format: int64
          description: Timestamp when the asset was last observed.
        issues_critical:
          type: integer
        'xdm.asset.strong_id':
          type: string
        'xdm.asset.type.category':
          type: string
        'xdm.asset.name':
          type: string
          nullable: true
        'xdm.asset.type.name':
          type: string
        cases_breakdown:
          type: object
          properties:
            critical:
              type: integer
            high:
              type: integer
            low:
              type: integer
            medium:
              type: integer
        'xdm.asset.provider':
          type: string
        'xdm.asset.type.class':
          type: string
        'xdm.asset.id':
          type: string
          description: The unique identifier for the asset.
        'xdm.asset.type.id':
          type: string
        cases_critical:
          type: integer
        'xdm.asset.group_ids':
          type: array
          items:
            type: string
        'xdm.asset.realm':
          type: string
        'xdm.host.ipv4_addresses':
          type: array
          items:
            type: string
