openapi: 3.0.0
paths:
  /public_api/v1/entries/get:
    post:
      summary: Get War Room Entries
      description: |-
        Get the War Room entries for a specific case or alert.

        You can filter by:
        - Timestamp (fromTime)
        - ID range (firstID, lastID)
        - Entry categories (notes, chat, attachments, etc.)
        - Tags

        Entry Categories:
        - tags: Tags added to the investigation
        - chats: Team communication messages
        - notes: Entries marked as notes
        - attachments: Files uploaded to War Room
        - incidentInfo: Case history
        - commandAndResults: Commands and their results
        - playbookTaskResult: Playbook task results
        - playbookTaskStartAndDone: Task execution records
        - playbookErrors: Playbook error entries

        Use this to:
        - Review investigation history
        - Extract analyst notes
        - Download War Room attachments
        - Audit investigation activities
      operationId: get_war_room_entries
      tags:
        - Incident Management
      requestBody:
        description: JSON object with case/alert ID and optional filters
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetWarRoomEntriesRequest'
            examples:
              get_all_entries:
                summary: Get all War Room entries for a case
                value:
                  id: "CASE-1093"
                  filter:
                    pagesize: 100
              get_notes_only:
                summary: Get only notes from War Room
                value:
                  id: "CASE-1093"
                  filter:
                    categories: ["notes", "chats"]
                    pagesize: 50
              get_alert_entries:
                summary: Get entries for an alert
                value:
                  id: "3890"
                  filter:
                    pagesize: 20
      responses:
        '200':
          description: Successful response with War Room entries
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid API credentials
        '402':
          description: Payment required
        '403':
          description: Forbidden - insufficient permissions
        '500':
          description: Internal server error

components:
  schemas:
    GetWarRoomEntriesRequest:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          description: |
            Case or alert ID.
            - For cases: Use "CASE-{id}" format (e.g., "CASE-1093")
            - For alerts: Use alert ID directly (e.g., "3890")
        filter:
          type: object
          description: Optional filters for entries
          properties:
            firstID:
              type: string
              description: Return results starting from this investigation ID
            lastID:
              type: string
              description: Return results up to this investigation ID
            pagesize:
              type: integer
              description: Number of entries to return (0 = all)
              default: 0
            fromTime:
              type: string
              description: RFC3339 timestamp - filter from this time forward
            categories:
              type: array
              description: Entry categories to include
              items:
                type: string
                enum:
                  - tags
                  - chats
                  - notes
                  - attachments
                  - incidentInfo
                  - commandAndResults
                  - playbookTaskResult
                  - playbookTaskStartAndDone
                  - playbookErrors
            tags:
              type: array
              description: Filter by specific tags
              items:
                type: string
