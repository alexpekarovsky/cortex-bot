openapi: 3.0.0
paths:
  /public_api/v1/actions/get_action_status/:
    post:
      summary: Get Status of Response Actions
      description: |-
        Retrieves the current status of one or more response actions that have been executed.
        Use this to monitor the progress and outcome of remediation actions such as:
        - Endpoint isolation
        - Process termination
        - File quarantine
        - Script execution
        - File retrieval
        - Endpoint scans

        Each action returns an action_id when initiated. Use that action_id here to check
        if the action succeeded, failed, is still in progress, or is pending.

        Essential for:
        - Verifying remediation actions completed successfully
        - Troubleshooting failed actions
        - Monitoring progress of long-running actions
        - Confirming containment measures are in effect

        Action statuses include:
        - PENDING: Action queued but not yet started
        - IN_PROGRESS: Action currently executing
        - COMPLETED_SUCCESSFULLY: Action completed without errors
        - COMPLETED_PARTIALLY: Action partially succeeded
        - FAILED: Action failed to execute
        - TIMEOUT: Action timed out
        - ABORTED: Action was cancelled
      operationId: get_action_status
      tags:
        - Actions
      requestBody:
        description: JSON object containing action IDs to check status for
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetActionStatusRequest'
            examples:
              check_action_status:
                summary: Check status of an action group
                value:
                  request_data:
                    group_action_id: 999999999
      responses:
        '200':
          description: Successful response containing action status information
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid API credentials
        '403':
          description: Forbidden - insufficient permissions

components:
  schemas:
    GetActionStatusRequest:
      type: object
      properties:
        request_data:
          type: object
          required:
            - group_action_id
          properties:
            group_action_id:
              type: integer
              description: The group action ID returned when an action was initiated
