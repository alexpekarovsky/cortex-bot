openapi: 3.0.0
paths:
  /public_api/v1/indicators/insert_csv:
    post:
      summary: Insert Simple Indicators (CSV)
      description: |-
        Upload IOCs in CSV format that you retrieved from external threat intelligence sources.

        Note: Cortex XSIAM does not scan historic data, but rather only new incoming data.

        CSV Format Requirements:
        - First line MUST be the header
        - Required fields: indicator, type, severity
        - Optional fields: expiration_date, comment, reputation, reliability, class, vendor.*

        Valid Types: HASH, IP, PATH, DOMAIN_NAME, FILENAME
        Valid Severities: INFO, LOW, MEDIUM, HIGH, CRITICAL
        Valid Reputations: GOOD, BAD, SUSPICIOUS, UNKNOWN
        Valid Reliability: A-F (A=most reliable)

        Use validate=true to get detailed error messages.
      operationId: insert_indicators_csv
      tags:
        - Indicator Management
      requestBody:
        description: JSON object with CSV string of IOCs
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertIndicatorsCsvRequest'
            examples:
              upload_csv:
                summary: Upload IOCs via CSV
                value:
                  request_data: "indicator,type,severity,expiration_date,comment,reputation,reliability,class,vendor.name,vendor.reputation,vendor.reliability\nB2c74bf609159f27dd89a829501ec34d6596d8b39a2cce7add73a8207088817a,HASH,HIGH,1587054895000,Test IOC,BAD,D,Malware,IBM,GOOD,B\n"
                  validate: true
      responses:
        '200':
          description: Successful response
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '402':
          description: Payment required
        '403':
          description: Forbidden
        '500':
          description: Internal server error

components:
  schemas:
    InsertIndicatorsCsvRequest:
      type: object
      properties:
        request_data:
          type: string
          description: CSV string with header line and IOC data lines
        validate:
          type: boolean
          description: Return detailed validation errors on failure
          default: true
