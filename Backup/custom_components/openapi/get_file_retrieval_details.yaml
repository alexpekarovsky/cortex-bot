openapi: 3.0.0
paths:
  /public_api/v1/actions/file_retrieval_details:
    post:
      summary: Get File Retrieval Details
      description: |-
        View the API required to call in order to download the file retrieved by the
        Retrieve File API request according to the action ID.

        The response contains download URLs you need to:
        1. Download the file using the provided URL
        2. Unzip the file to view contents

        Example download command:
        curl -XPOST "https://api-{fqdn}/public_api/v1/download/<api_value>" \
          -H "x-xdr-auth-id:{API_KEY_ID}" \
          -H "Authorization:{API_KEY}" \
          -H 'Content-Type:application/json' \
          --output /tmp/file.zip

        Then unzip: unzip /tmp/file.zip

        Use this after retrieve_files to actually download the retrieved files.
      operationId: get_file_retrieval_details
      tags:
        - File Retrieval
      requestBody:
        description: JSON object containing the file retrieval action ID
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetFileRetrievalDetailsRequest'
            examples:
              get_download_urls:
                summary: Get download URLs for retrieved files
                value:
                  request_data:
                    group_action_id: 12345
      responses:
        '200':
          description: Successful response with download URLs
        '400':
          description: Bad request - invalid parameters
        '401':
          description: Unauthorized - invalid API credentials
        '402':
          description: Payment required
        '403':
          description: Forbidden - insufficient permissions
        '500':
          description: Internal server error

components:
  schemas:
    GetFileRetrievalDetailsRequest:
      type: object
      properties:
        request_data:
          type: object
          required:
            - group_action_id
          properties:
            group_action_id:
              type: integer
              description: The action ID from the Retrieve File API response (must be an integer)
