openapi: 3.0.0
paths:
  /public_api/v1/widgets/delete:
    post:
      summary: Delete Custom XQL Widgets
      description: |-
        Deletes custom XQL widgets from XSIAM based on filter criteria.

        Use this to:
        - Remove obsolete or unused widgets
        - Clean up test widgets
        - Manage widget inventory

        Requires Instance Administrator permissions.

        Filter Fields:
        - title: Widget title (string)
        - created_by: Creator name (string)

        Filter Operators:
        - EQ: Equals
        - NEQ: Not equals
        - CONTAINS: Contains substring

        Note: This only deletes custom XQL widgets, not predefined system widgets.
      operationId: delete_widgets
      tags:
        - Widgets
      requestBody:
        description: JSON object containing filters to select widgets for deletion
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteWidgetsRequest'
            examples:
              delete_by_title:
                summary: Delete widget by exact title
                value:
                  request_data:
                    filters:
                      - field: "title"
                        operator: "EQ"
                        value: "Test Widget"
              delete_by_creator:
                summary: Delete widgets created by user
                value:
                  request_data:
                    filters:
                      - field: "created_by"
                        operator: "CONTAINS"
                        value: "test_user"
      responses:
        '200':
          description: Widgets deleted successfully
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error

components:
  schemas:
    DeleteWidgetsRequest:
      type: object
      properties:
        request_data:
          type: object
          properties:
            filters:
              type: array
              description: |-
                Array of filter objects to select widgets for deletion.
                Each filter has:
                - field: "title" or "created_by"
                - value: String to match
                - operator: "EQ", "NEQ", "CONTAINS"
              items:
                type: object
                required:
                  - field
                  - operator
                  - value
                properties:
                  field:
                    type: string
                    enum: ["title", "created_by"]
                  operator:
                    type: string
                    enum: ["EQ", "NEQ", "CONTAINS"]
                  value:
                    type: string
