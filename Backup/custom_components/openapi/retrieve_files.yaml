openapi: 3.0.0
paths:
  /public_api/v1/endpoints/file_retrieval/:
    post:
      summary: Retrieve Files from Endpoints
      description: |-
        Retrieves suspicious or malicious files from endpoints for forensic analysis.
        The files are extracted from the target endpoint and made available for download,
        allowing security analysts to perform malware analysis, reverse engineering,
        and detailed forensic investigation.

        Use this when:
        - You need to analyze suspicious files identified in alerts
        - Performing malware analysis on unknown files
        - Collecting forensic evidence for investigations
        - Extracting files for threat intelligence purposes
        - Need to submit files to sandboxing or malware analysis tools

        IMPORTANT: Retrieved files may be malicious. Handle with appropriate security precautions:
        - Analyze in isolated sandbox environments
        - Do not execute on production systems
        - Use proper malware handling procedures

        The endpoint agent will locate and extract the specified files, making them
        available for download through the XSIAM interface.

        WORKFLOW:
        1. retrieve_files → Initiate file retrieval (returns action_id)
        2. get_action_status → Monitor retrieval progress using action_id
        3. get_file_retrieval_details → Get download URLs when complete
        4. Download the file using the provided URL
      operationId: retrieve_files
      tags:
        - Endpoint Response
      requestBody:
        description: JSON object containing endpoint ID and file paths to retrieve
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveFilesRequest'
            examples:
              retrieve_windows_files:
                summary: Retrieve Windows files
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["a1b2c3d4e5f6g7h8"]
                    files:
                      windows:
                        - "C:\\Users\\admin\\suspicious.exe"
                        - "C:\\Temp\\malware.dll"
              retrieve_linux_files:
                summary: Retrieve Linux files
                value:
                  request_data:
                    filters:
                      - field: "endpoint_id_list"
                        operator: "in"
                        value: ["linux-endpoint-123"]
                    files:
                      linux:
                        - "/tmp/suspicious_script.sh"
                        - "/var/log/malware.log"
      responses:
        '200':
          description: Successful response - file retrieval action initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: object
                    properties:
                      action_id:
                        type: integer
                        description: Unique ID for tracking this file retrieval action
        '400':
          description: Bad request - invalid parameters
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Bad Request"
        '401':
          description: Unauthorized - invalid API credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '403':
          description: Forbidden - insufficient permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Forbidden"

components:
  schemas:
    RetrieveFilesRequest:
      type: object
      properties:
        request_data:
          type: object
          required:
            - filters
            - files
          properties:
            filters:
              type: array
              description: Filter criteria for selecting endpoints
              items:
                type: object
                properties:
                  field:
                    type: string
                    enum: [endpoint_id_list]
                  operator:
                    type: string
                    enum: [in]
                  value:
                    type: array
                    items:
                      type: string
                required: [field, operator, value]
            files:
              type: object
              description: Files to retrieve per operating system
              properties:
                windows:
                  type: array
                  description: Windows file paths
                  items:
                    type: string
                linux:
                  type: array
                  description: Linux file paths
                  items:
                    type: string
                macos:
                  type: array
                  description: macOS file paths
                  items:
                    type: string
            incident_id:
              type: string
              description: Optional incident ID to associate with retrieval
